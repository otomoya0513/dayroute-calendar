name: Maestro E2E

on:
  workflow_dispatch:
  deployment_status:
  schedule:
    # 毎日09:00 JST
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: maestro-production-e2e
  cancel-in-progress: true

jobs:
  production-e2e:
    if: >-
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Wait for the production site
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 10 \
              https://dayroute-calendar.vercel.app >/dev/null; then
              exit 0
            fi
            echo "Production site is not ready yet (attempt ${attempt}/20)"
            sleep 15
          done
          exit 1

      - name: Run production smoke test
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          timeout --kill-after=30s 5m \
            xvfb-run --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            maestro test .maestro/01-production-smoke.yaml

      - name: Run event creation test
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          timeout --kill-after=30s 5m \
            xvfb-run --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            maestro test .maestro/02-create-event.yaml

      - name: Run favorite and start-location test
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          timeout --kill-after=30s 5m \
            xvfb-run --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            maestro test .maestro/03-favorite-start-location.yaml

      - name: Upload Maestro debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests
          if-no-files-found: ignore