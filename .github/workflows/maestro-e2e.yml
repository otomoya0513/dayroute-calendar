name: Maestro E2Eテスト

on:
  workflow_dispatch:
  deployment_status:
  schedule:
    # 毎日09:00 JST
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: maestro-production-e2e
  cancel-in-progress: true

jobs:
  production-smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'

    name: Maestro - ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 日表示
            flow: .maestro/01-production-smoke.yaml
          - name: 週表示
            flow: .maestro/view-week.yaml
          - name: 月表示
            flow: .maestro/view-month.yaml
          - name: 年表示
            flow: .maestro/view-year.yaml

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Maestro CLIをインストール
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: 仮想ディスプレイをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: 本番サイトの起動を待機
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 \
              https://dayroute-calendar.vercel.app >/dev/null; then
              exit 0
            fi

            echo "Production site is not ready (${attempt}/12)"
            sleep 10
          done

          exit 1

      - name: Maestroテストを実行
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          timeout --kill-after=15s 3m \
            xvfb-run --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            maestro test "${{ matrix.flow }}"

      - name: Maestroデバッグファイルをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-${{ matrix.name }}
          path: ~/.maestro/tests
          if-no-files-found: ignore
