url: https://dayroute-calendar.vercel.app
name: Production smoke and calendar views
tags:
  - smoke
---
- launchApp:
    clearState: true

- assertVisible: DayRoute
- assertVisible: 時間順の予定

- tapOn:
    css: "#view-week"
- assertVisible: CALENDAR OVERVIEW

- tapOn:
    css: "#view-month"
- assertVisible:
    text: "^[0-9]{4}年[0-9]{1,2}月の予定$"

- tapOn:
    css: "#view-year"
- assertVisible:
    text: "^[0-9]{4}年の予定$"

- tapOn:
    css: "#view-day"
- assertVisible: TODAY'S ROUTE
- assertVisible: 時間順の予定