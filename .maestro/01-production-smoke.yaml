url: https://dayroute-calendar.vercel.app
name: Production smoke and calendar views
tags:
  - smoke
---
- launchApp:
    clearState: true

- assertVisible: DayRoute
- assertVisible: 時間順の予定
- assertVisible:
    css: "#add-event-button"

- tapOn:
    css: "#view-week"
- assertVisible: CALENDAR OVERVIEW
- assertVisible:
    css: "#view-week.active"
- assertVisible:
    text: ".*—.*の予定"

- tapOn:
    css: "#view-month"
- assertVisible:
    css: "#view-month.active"
- assertVisible:
    text: ".*年.*月の予定"

- tapOn:
    css: "#view-year"
- assertVisible:
    css: "#view-year.active"
- assertVisible:
    text: ".*年の予定"

- tapOn:
    css: "#view-day"
- assertVisible:
    css: "#view-day.active"
- assertVisible: 時間順の予定